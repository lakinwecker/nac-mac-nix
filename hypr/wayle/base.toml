imports = []

[general]
font-sans = "FiraCode Nerd Font"
font-mono = "FiraCode Nerd Font"
tearing-mode = false

[bar]
scale = 0.75
location = "top"
exclusive = true
layer = "top"
bg = "bg-surface"
border-location = "none"
rounding = "none"
button-group-module-gap = 0.05
button-group-background = "transparent"
button-label-weight = "semibold"

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
]
center = ["media"]
right = [
    "custom-screenshot",
    "volume",
    "network",
    "bluetooth",
    "battery",
    "notifications",
    "systray",
    { name = "clocks", modules = [
        "clock",
        "custom-eastern",
        "custom-utc",
        "custom-london",
        "custom-lyon",
    ] },
]

[styling]
theme-provider = "wayle"

[modules]

# roach's keyboard has no Print key, so the bar carries the screenshot action
# too. No command: interval-ms = 0 is manual-poll, and an empty format leaves a
# pure icon button.
[[modules.custom]]
id = "screenshot"
interval-ms = 0
format = ""
label-show = false
icon-name = "ld-camera-symbolic"
tooltip-format = "Screenshot — click: select area, right-click: 3s delay"
left-click = "/etc/hypr/scripts/screenshot.sh area"
right-click = "/etc/hypr/scripts/screenshot.sh delayed 3"

# One module per zone rather than world-clock: its tz() renders an empty label
# here, and a single label can't give UTC its own background. TZ takes the full
# zoneinfo path because the bare name silently falls back to UTC.
[[modules.custom]]
id = "eastern"
command = "TZ=:/etc/zoneinfo/America/New_York date +%H:%M"
interval-ms = 5000
format = "{{ output }}"
icon-show = false
label-color = "yellow"
button-bg-color = "transparent"

[[modules.custom]]
id = "utc"
command = "TZ=:/etc/zoneinfo/UTC date +%H:%M"
interval-ms = 5000
format = "{{ output }}"
icon-show = false
label-color = "fg-on-accent"
button-bg-color = "accent"

[[modules.custom]]
id = "london"
command = "TZ=:/etc/zoneinfo/Europe/London date +%H:%M"
interval-ms = 5000
format = "{{ output }}"
icon-show = false
label-color = "yellow"
button-bg-color = "transparent"

[[modules.custom]]
id = "lyon"
command = "TZ=:/etc/zoneinfo/Europe/Paris date +%H:%M"
interval-ms = 5000
format = "{{ output }}"
icon-show = false
label-color = "yellow"
button-bg-color = "transparent"

[modules.hyprland-workspaces]
min-workspace-count = 15
monitor-specific = false
display-mode = "label"

[modules.hyprland-workspaces.workspace-map]
11 = { label = "c" }
12 = { label = "e" }
13 = { label = "g" }
14 = { label = "s" }
15 = { label = "*" }

[modules.media]
label-max-length = 35

[modules.volume]

[modules.network]

[modules.bluetooth]

[modules.battery]

[modules.notifications]
popup-position = "bottom-right"
blocklist = ["discord", "slack"]

[modules.systray]

[modules.clock]
format = "%H:%M"
dropdown-show-seconds = false

[modules.dashboard]

[osd]
enabled = true
position = "bottom"

# awww owns the wallpaper; leave Wayle's engine off so the two don't fight.
[wallpaper]
engine-enabled = false
